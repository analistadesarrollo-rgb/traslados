		<script type="text/javascript">
function send(url){

	
	var username = document.getElementById('frmLogin:usuario').value;
	var contrasena = document.getElementById('frmLogin:contrasena').value;


	var xmlhttp =new XMLHttpRequest();
	
	xmlhttp.open("POST",url,true);
	//xmlhttp.setRequestHeader("Content-type","application/x-www-form-urlencoded");
	xmlhttp.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
	var parameter = 'usuario='+username;
	xmlhttp.send(parameter);
	window.location.replace(url); 
	
}
function replace(){
	
	window.location.replace("http://"+window.location.host+"/Seguridad-WEB/XHTML/ModuloSeguridad/proxy.xhtml");
}



function http_req(url){
	var username = document.getElementById('frmLogin:usuario').value;
	var contrasena = document.getElementById('frmLogin:contrasena').value;
	var jsonData = document.getElementById('frmLogin:jsonData').value;
	var rolUsuario = document.getElementById('frmLogin:rolUsuario').value;
	var ipCerberus = document.getElementById('frmLogin:ipCerberus').value;
	var puertoCerberus = document.getElementById('frmLogin:puertoCerberus').value;
	var parameter= 'usuario='+username+';'+contrasena+';'+jsonData+';'+rolUsuario+';'+ipCerberus+';'+puertoCerberus;
	
	 if(window.XMLHttpRequest){
			
	  var ajaxResponse = new XMLHttpRequest();
	 }else
	  if(window.ActiveXObject){ // IE
	   try{
	    var ajaxResponse = new ActiveXObject("Msxml2.XMLHTTP");
	   }catch(e){
	    try {
	     var ajaxResponse = new ActiveXObject("Microsoft.XMLHTTP");
	    }catch(e){
	     return false;
	    }
	   };
	  };
	  if(!ajaxResponse){
	   return false;
	  };
	  if(parameter){
	   ajaxResponse.open('POST', url, false);
	   ajaxResponse.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
	   ajaxResponse.send(parameter);
	   window.location.replace(url); 
	
	  }else{
	   ajaxResponse.open('GET', url, false);
	   ajaxResponse.send(null);
	   window.location.replace(url); 
	  }
	  if(ajaxResponse.status == 200){
	   return ajaxResponse.responseText;
	  }else{
	   return false;
	  };
	};
</script>
