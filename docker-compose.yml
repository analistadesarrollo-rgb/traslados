version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transfer-bot
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - TZ=America/Bogota
    networks:
      - red-gane-int

  nginx:
    image: nginx:stable-alpine3.19-slim
    container_name: transfer-bot-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - red-gane-int

networks:
  red-gane-int:
    external: true
